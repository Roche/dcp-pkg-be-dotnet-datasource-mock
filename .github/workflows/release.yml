name: Build and Release .NET App

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required so git can read all existing tags in the repository
          fetch-depth: 0

      - name: Get current tag version
        id: get_version
        run: |
          TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "version=$TAG" >> $GITHUB_OUTPUT

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build .NET application
        run: dotnet publish OpenDCP.Framework.Datasource.Mock/OpenDCP.Framework.Datasource.Mock.csproj --configuration Release --no-restore --output ./build-output -p:AssemblyVersion=${{ steps.get_version.outputs.version }} -p:Version=${{ steps.get_version.outputs.version }}

      - name: Archive build output
        run: zip -r release-${{ steps.get_version.outputs.version }}.zip ./build-output/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: ${{ steps.get_version.outputs.version }}
          files: release-${{ steps.get_version.outputs.version }}.zip
          generate_release_notes: true
